# docker-compose.prod.yml
services:
  fifa_backend:
    build:
      context: ./backend
    container_name: fifa_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    ports:
      - "3003:3000"
    networks:
      - fifa_network

  fifa_frontend:
    build:
      context: ./frontend
      target: prod
    container_name: fifa_frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env.production
    depends_on:
      - fifa_backend
    ports:
      - "3004:3000"
    networks:
      - fifa_network

networks:
  fifa_network:
    driver: bridge